name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest yt-dlp
      - name: Install ffmpeg (Ubuntu runners lack it; Windows runners have it)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install ffmpeg on Windows (not on PATH by default)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Run test suite
        run: python -m pytest tests/ -q
