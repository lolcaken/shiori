[project]
name = "shiori"
version = "0.1.0"
description = "Archive a YouTube channel to local mp4 files with embedded soft subtitles"
requires-python = ">=3.11"

[project.scripts]
shiori = "shiori.cli.entrypoint:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shiori*"]
