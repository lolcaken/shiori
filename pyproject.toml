[project]
name = "shiori"
version = "0.1.0"
description = "Archive a YouTube channel to local mp4 files with embedded soft subtitles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lolcaken/shiori"
Issues = "https://github.com/lolcaken/shiori/issues"

[project.scripts]
shiori = "shiori.cli.entrypoint:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shiori*"]
